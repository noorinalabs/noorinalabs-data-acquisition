# Pre-commit hooks for noorinalabs-data-acquisition
# Install:  uvx pre-commit install && uvx pre-commit install --hook-type pre-push
# Docs:     https://pre-commit.com/
#
# This MIRRORS .github/workflows/ci.yml so a local commit/push fails fast
# instead of surfacing a lint/format/type/test error only after a PR is opened
# (Phase-3 end-state criterion #6 / noorinalabs-main#327). The pre-commit <-> CI
# sync-drift gate (.claude/lib/pre_commit_ci_sync.py, wired as a CI job) verifies
# this mirror stays in lockstep.
#
# Stage split:
#   pre-commit (fast, every commit) — ruff-format, ruff-lint over the repo, plus
#     gitleaks secret-scan, pinned actionlint on workflows, and pinned cspell
#     over the authored-prose set.
#   pre-push   (heavier, every push) — mypy strict + the pytest suite. These run
#     the whole src/ + tests surface, so they're push-time not commit-time to
#     keep the commit loop snappy while still catching everything before the
#     code leaves the machine.
#
# CI parity notes (data-acquisition specifics):
#   * CI runs `uv run ruff/mypy/pytest`; the heavier local hooks use `uv run`
#     too so the exact pinned tool versions from uv.lock run locally, never a
#     stray global ruff/mypy. ruff itself runs via the ruff-pre-commit mirror,
#     pinned to v0.15.11 to match the org-canonical ruff version (parent
#     noorinalabs-main + isnad-graph pin the same) — bump in lockstep.
#   * pytest MUST run with ENVIRONMENT=test (the repo's test env-guard /
#     conftest require it); the entry sets it inline. Integration tests require
#     external services and run in CI only (the `-m "not integration"` filter
#     here mirrors ci.yml's unit `test` job).
#   * actionlint runs via the rhysd/actionlint pre-commit mirror pinned to
#     v1.7.12 so the same workflow-lint runs locally that docs.yml runs in CI.
#   * cspell runs via the streetsidesoftware/cspell-cli mirror pinned to v8.4.0
#     to match the exact cspell the `streetsidesoftware/cspell-action@…v8.4.0`
#     CI step (docs.yml `Spellcheck (cspell)`) bundles — same engine +
#     dictionaries on both sides. `--config .cspell.json` reuses the same
#     dictionaries + ignore rules CI loads; the `files` regex is the equivalent
#     of the CI action's authored-prose glob set.
#
# The kind-level mirror (ruff-lint, ruff-format, mypy, pytest, actionlint,
# cspell, and the #744 dockerfile-base-pin + fixture-realism gates present on
# both sides) is enforced in CI by
# `.claude/lib/pre_commit_ci_sync.py` — if a future edit drops one side, that
# gate fails the build. Per noorinalabs-main#684 the gate now globs ALL
# workflows (ci.yml AND docs.yml), so the docs.yml cspell + actionlint jobs are
# demanded here too — local "clean" must mirror the COMPLETE CI check-set, not a
# subset. (The remaining docs.yml jobs — markdownlint, lychee, YAML/JSON
# syntax — are not yet classified kinds, so the gate stays silent on them.)

repos:
  # --- Ruff formatter & linter (mirror of ci.yml Lint job) ---
  # ruff-format runs first so format fixes don't trigger re-lint.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-format
        name: ruff-format
      - id: ruff
        args: [--fix]
        name: ruff-lint

  # --- Secret detection ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
        name: gitleaks

  # --- Workflow lint (pinned actionlint mirror; same lint docs.yml runs in CI) ---
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint

  # --- Spellcheck (pinned cspell mirror of docs.yml `Spellcheck (cspell)`) ---
  # Pinned to v8.4.0 of cspell-cli to match the exact cspell the
  # `streetsidesoftware/cspell-action@…v8.4.0` CI step bundles (same engine +
  # dictionaries). `language: node`, so pre-commit provisions its own node/cspell
  # env (no system cspell required). `--config .cspell.json` reuses the CI
  # dictionaries + ignore rules; `files` is the regex equivalent of the CI
  # action's authored-prose glob set (docs/, CLAUDE.md, RUNBOOK.md, the team
  # charter). New domain vocabulary then fails `pre-commit run` locally instead
  # of only surfacing as a CI red after push (#684).
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v8.4.0
    hooks:
      - id: cspell
        name: cspell
        args: ["--no-must-find-files", "--no-progress", "--no-summary", "--config", ".cspell.json"]
        files: ^(docs/.*\.md|CLAUDE\.md|RUNBOOK\.md|\.claude/team/charter\.md)$

  # --- Charter-prose→code gates (mirror ci.yml `Base-image pin + fixture
  #     realism` job; rolled in by #744 / noorinalabs-main#735). Both invoke a
  #     stdlib-only `.claude/lib/check_*.py` via `language: system` python3 — no
  #     uv/node env needed. The sync-drift gate classifies the `dockerfile-base-
  #     pin` / `fixture-realism` kinds, so dropping either side is harmful drift
  #     (#684 parity). Run at the fast commit stage, scoped via `files:` so they
  #     only fire when a Dockerfile / fixture changes. ---
  - repo: local
    hooks:
      # Every Dockerfile FROM must be digest-pinned (image:tag@sha256:<digest>)
      # AND carry the matching distro upgrade (charter tech-decisions.md § Base
      # Image Pinning). Dockerfile.load is the repo's only image.
      - id: dockerfile-base-pin
        name: dockerfile-base-pin
        entry: python3 .claude/lib/check_dockerfile_base_pin.py Dockerfile.load
        language: system
        pass_filenames: false
        files: ^Dockerfile\.load$
        stages: [pre-commit]
      # Arabic hadith/isnad TEXT fixtures must be production-realistic — voweled
      # and carrying the عن transmission particle (charter pull-requests.md §
      # Production-Realistic Input). Scoped to the curated text corpus (json/csv/
      # txt under any tests `fixtures/` dir); the check skips non-Arabic files and
      # `find` keeps new curated fixtures covered. Deliberately OUT of scope
      # (documented exemption, not toy fixtures): raw scraped page captures — the
      # `.html` under test_acquire/ and the `tusi_raw/` thaqalayn clone tree
      # (verbatim upstream bytes — the rawest realism, judged by parse-ability,
      # cannot be "greener than real data"); and two name-only NER fixtures,
      # itqan_rijal_sample.json (rijal biographical NAMES, unvoweled in real rijal
      # DBs) + cluster_precision_gold.json (clustering gold of narrator names),
      # which carry no isnad string so the عن/vocalization floor (charter-scoped
      # to isnad text) does not apply. Mirrors the ci.yml step's `find` exactly.
      - id: fixture-realism
        name: fixture-realism
        entry: bash -c 'find tests -type d -path "tests/test_parse/fixtures/tusi_raw" -prune -o -type f \( -name "*.json" -o -name "*.csv" -o -name "*.txt" \) -path "*/fixtures/*" ! -name "itqan_rijal_sample.json" ! -name "cluster_precision_gold.json" -print0 | xargs -0 -r python3 .claude/lib/check_fixture_realism.py'
        language: system
        pass_filenames: false
        files: ^tests/.*/fixtures/.*\.(json|csv|txt)$
        stages: [pre-commit]

  # --- Heavier checks run at pre-push (mirror CI's Type Check + Test jobs).
  #     Run as `local`/`system` hooks via `uv run` so the pinned tools from
  #     uv.lock are used and never drift from CI. ---
  - repo: local
    hooks:
      - id: mypy
        name: mypy-strict (pre-push)
        entry: uv run mypy src/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pytest
        name: pytest (pre-push)
        entry: bash -c 'ENVIRONMENT=test uv run pytest tests/ -x --tb=short -q -m "not integration"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
