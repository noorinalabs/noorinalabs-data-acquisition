# Publish the data-acquisition loader/ops image to GitHub Container Registry (GHCR).
#
# Why this exists (da#329): the graph remediation ops we run against stg/prod
# Neo4j — the TRANSMITTED_TO.hadith_id canonicalization migration (da#325) and
# the GDS narrator-centrality enrich (da#326) — are driven by the `isnad` CLI
# (`python -m src.cli migrate-transmitted-hadith-ids`, `python -m src.cli enrich`).
# To run them as IaC (behind a deploy-repo workflow, not a box one-off) the
# deploy repo needs a pre-built image to pull and run attached to the
# egress-isolated `noorinalabs_backend` docker network — exactly as
# noorinalabs-deploy's reembed-corpus.yml pulls the isnad-graph embed image.
#
# Dockerfile.load already bakes the full CLI + queries/ and is designed for that
# backend network (no pip at run time). Today it is only built locally via
# scripts/load_staging.sh — never published, so deploy has nothing to pull.
# This workflow closes that gap by mirroring the isnad-graph embed image publish
# (the standalone build-and-push-embed job in isnad-graph's ghcr-publish.yml).
#
# Image: ghcr.io/noorinalabs/noorinalabs-data-acquisition-load
# Tags: same scheme as the embed image — sha-<short>, latest, stg-<short>,
#       stg-latest. NO prod-* tags: those are written ONLY by deploy's promote
#       flow, never by a publish workflow.
#
# Deliberately NO notify-deploy job: this image is consumed on-demand by the
# deploy-side graph-ops.yml (workflow_dispatch), never by a standing deploy, so
# a merge to main must NOT auto-fire a deploy.

name: Publish to GHCR

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "queries/**"
      - "Dockerfile.load"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ghcr-publish.yml"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Build and publish the loader/ops image (baked CLI + queries/, pyarrow +
  # neo4j driver). amd64-only: the VPS is amd64 and a cross-arch build through
  # QEMU is prohibitively slow with no arm64 consumer today. Mirrors the
  # isnad-graph build-and-push-embed job.
  build-and-push-load:
    name: Build and push (load)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (data-acquisition)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/noorinalabs/noorinalabs-data-acquisition-load
          # Tag scheme identical to the isnad-graph embed image (Contract v5):
          #   sha-<short>   — immutable, one per push; written on every event.
          #   latest        — mutable pointer; written on main push + semver tags.
          #   stg-<short>   — immutable per-push, stg namespace; push-to-main ONLY.
          #   stg-latest    — moving pointer to the most-recent stg-<short>;
          #                   push-to-main ONLY. Consumers (deploy graph-ops.yml)
          #                   pull this for a stable target without chasing SHAs.
          #   prod-*        — written by deploy's promote flow ONLY, never here.
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=stg-,format=short,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=stg-latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile.load
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=load
          cache-to: type=gha,mode=max,scope=load

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          # Scan by digest — guaranteed to exist immediately after push and
          # immune to tag-resolution races. metadata-action emits :latest,
          # :sha-*, and (on main) :stg-* + :stg-latest — never :main. Digest is
          # the one stable handle across all of them. See user-service#61 retro.
          image-ref: ${{ env.REGISTRY }}/noorinalabs/noorinalabs-data-acquisition-load@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Summary
        if: always()
        run: |
          {
            echo "## GHCR Publish (load): ${{ job.status }}"
            echo ""
            echo "- **Ref:** ${{ github.ref_name }}"
            echo "- **Image:** ${{ env.REGISTRY }}/noorinalabs/noorinalabs-data-acquisition-load"
            echo "- **Platforms:** linux/amd64"
            echo "- **SHA:** ${{ github.sha }}"
            echo "- **Digest:** ${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
