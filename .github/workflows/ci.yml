name: CI

on:
  push:
    branches:
      - main
      - "deployments/**"
  pull_request:
    branches:
      - main
      - "deployments/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Mypy
        run: uv run mypy src/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short -x -m "not integration"
        env:
          ENVIRONMENT: test

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v -m integration
        env:
          ENVIRONMENT: test

  base-pin-and-fixture-realism:
    name: Base-image pin + fixture realism
    runs-on: ubuntu-latest
    # Charter-prose→code gates rolled in by #744 (built in noorinalabs-main#735).
    # Both invoke a stdlib-only `.claude/lib/check_*.py` (no uv/node needed) and
    # are mirrored by the `dockerfile-base-pin` / `fixture-realism` pre-commit
    # hooks; the sync-drift gate classifies both kinds, so dropping either the CI
    # step or the local hook is harmful drift. Each check is kept a single-line
    # `run:` so the line-scanner sync classifier registers the script name.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Every Dockerfile FROM must be digest-pinned + carry the matching distro
      # upgrade (charter § Base Image Pinning). Dockerfile.load is the only image.
      - name: Dockerfile base-image pin + upgrade
        run: python3 .claude/lib/check_dockerfile_base_pin.py Dockerfile.load
      # Arabic hadith/isnad TEXT fixtures must be production-realistic — voweled
      # and carrying the عن transmission particle (charter § Production-Realistic
      # Input). Scoped to the curated text corpus (json/csv/txt under any tests
      # `fixtures/` dir); the check skips non-Arabic files and `find` keeps new
      # curated fixtures covered. Deliberately OUT of scope (documented exemption,
      # not toy fixtures): raw scraped page captures — the `.html` under
      # test_acquire/ and the `tusi_raw/` thaqalayn clone tree (verbatim upstream
      # bytes; the rawest realism, judged by parse-ability, cannot be "greener
      # than real data"); and two name-only NER fixtures — itqan_rijal_sample.json
      # (rijal biographical NAMES, unvoweled in real rijal DBs) and
      # cluster_precision_gold.json (clustering gold of narrator names) — which
      # carry no isnad string, so the عن/vocalization floor (charter-scoped to
      # isnad text) does not apply.
      - name: Fixture realism (Arabic hadith/isnad text fixtures)
        run: find tests -type d -path 'tests/test_parse/fixtures/tusi_raw' -prune -o -type f \( -name '*.json' -o -name '*.csv' -o -name '*.txt' \) -path '*/fixtures/*' ! -name 'itqan_rijal_sample.json' ! -name 'cluster_precision_gold.json' -print0 | xargs -0 -r python3 .claude/lib/check_fixture_realism.py

  precommit-sync:
    name: Pre-commit ⇄ CI sync-drift gate
    runs-on: ubuntu-latest
    # Fails the build if a check this CI enforces (ruff/mypy/pytest/…) is NOT
    # mirrored in .pre-commit-config.yaml — the machine-enforcement that keeps
    # the local-hooks mirror from rotting (Phase-3 end-state #6 / main#327).
    # Per noorinalabs-main#684 the gate globs ALL workflows (ci.yml AND
    # docs.yml), so the docs.yml `Spellcheck (cspell)` + actionlint jobs are
    # demanded in the pre-commit mirror too — local "clean" must mirror the
    # COMPLETE CI check-set, not a subset.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check pre-commit ⇄ CI drift (all workflows)
        run: python3 .claude/lib/pre_commit_ci_sync.py .

      - name: Sync-gate unit tests
        # Lock the classifier behaviour (incl. the #684 cspell kind) and guard
        # docs.yml's cspell job from silent removal. unittest avoids a pytest
        # dependency in this lightweight job.
        run: python3 -m unittest discover -s .claude/lib/tests -p "test_*.py" -v
